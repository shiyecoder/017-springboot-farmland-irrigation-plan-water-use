server:
  port: 8086
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: irrigation-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/new_017?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt-secret: "irrigation-plan-water-accounting-secret-key-2026-new017"
  jwt-expire-hours: 12
  upload-dir: ./uploads
  base-price: 0.42
  excess-price: 0.55
  free-quota-per-mu: 30
